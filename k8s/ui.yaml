apiVersion: apps/v1
kind: Deployment
metadata:
  name: credito-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credito-ui
  template:
    metadata:
      labels:
        app: credito-ui
    spec:
      containers:
        - name: ui
          image: credito-ui:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://credito-service"   # Service de la API dentro del clúster
---
apiVersion: v1
kind: Service
metadata:
  name: credito-ui
spec:
  selector:
    app: credito-ui
  ports:
    - port: 8501
      targetPort: 8501
