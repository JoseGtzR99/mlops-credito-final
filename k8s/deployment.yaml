apiVersion: apps/v1
kind: Deployment
metadata:
  name: credito-api
  labels:
    app: credito-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: credito-api
  template:
    metadata:
      labels:
        app: credito-api
    spec:
      containers:
        - name: api
          image: credito-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://host.docker.internal:5000"
            - name: MODEL_NAME
              value: "credito-riesgo"
            - name: MODEL_ALIAS
              value: "production"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
